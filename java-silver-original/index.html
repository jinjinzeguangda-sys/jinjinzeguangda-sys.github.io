<title>Java Silver原作 演習コンソール</title>
<style>
  :root{
    --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBF9F5; --border:#E7E1D7;
    --ink:#23262B; --muted:#6B7280; --faint:#9AA3AF;
    --accent:#C9761B; --accent-soft:#F4E4CE;
    --ok:#2E9E6B; --ok-soft:#DCF2E7; --ng:#D9534A; --ng-soft:#FBE3E1;
    --code-bg:#F3EEE6; --code-ink:#33372E;
    --shadow:0 1px 2px rgba(30,25,15,.05), 0 8px 24px rgba(30,25,15,.06);
    --radius:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171C; --surface:#1B1F26; --surface-2:#20252D; --border:#2C323C;
      --ink:#E7E9EC; --muted:#9AA3AF; --faint:#6B7280;
      --accent:#E4A24A; --accent-soft:#3A2F1E;
      --ok:#48B98A; --ok-soft:#173026; --ng:#E5766D; --ng-soft:#331E1C;
      --code-bg:#0F1318; --code-ink:#CDD3C6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBF9F5; --border:#E7E1D7;
    --ink:#23262B; --muted:#6B7280; --faint:#9AA3AF;
    --accent:#C9761B; --accent-soft:#F4E4CE;
    --ok:#2E9E6B; --ok-soft:#DCF2E7; --ng:#D9534A; --ng-soft:#FBE3E1;
    --code-bg:#F3EEE6; --code-ink:#33372E;
    --shadow:0 1px 2px rgba(30,25,15,.05), 0 8px 24px rgba(30,25,15,.06);
  }
  :root[data-theme="dark"]{
    --bg:#14171C; --surface:#1B1F26; --surface-2:#20252D; --border:#2C323C;
    --ink:#E7E9EC; --muted:#9AA3AF; --faint:#6B7280;
    --accent:#E4A24A; --accent-soft:#3A2F1E;
    --ok:#48B98A; --ok-soft:#173026; --ng:#E5766D; --ng-soft:#331E1C;
    --code-bg:#0F1318; --code-ink:#CDD3C6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  /* ★回答して解説が出ると縦スクロールが発生し、古典的スクロールバーの環境では
     ビューポートが15px狭くなって選択肢が折り返す（＝回答の前後で位置が動く）。
     最初から場所を空けておく。
     ★2026-09-25: ここは @media (hover:hover) and (pointer:fine) で囲っていたが、外した。
       B案（○/×を出さない）にしたら「古典的スクロールバー＋指で触る」環境で
       8アプリ20問が跳ねた（A案は文字幅が1em狭くて既に折り返していたので隠れていただけ）。
     ★scrollbar-gutter ではなく overflow-y:scroll を使う。Safari が scrollbar-gutter に
       対応したのは 18.2（2024-12）で、古いiPhoneでは効かない。overflow-y:scroll は昔から効く。
     ★オーバーレイ型（iPhone/Android/既定のmacOS）はバーが幅を食わないので影響なし。
       実測（オーバーレイ相当・10本300問）: .opts の幅は 304px のまま／跳ね0。
       古典的バーの側も 289→289 で不動・跳ね0（同じ10本300問）。 */
  html{overflow-y:scroll}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 64px}
  .qcols{display:grid;grid-template-columns:var(--gtc,minmax(0,1fr) minmax(0,1fr));gap:24px;align-items:start;margin-top:6px}
  .qcols.nocode{grid-template-columns:minmax(0,720px);justify-content:center}
  .qcol-l,.qcol-r{min-width:0}
  .qcol-l .qcode{margin:0}
  .qcol-l{position:sticky;top:92px}
  @media (max-width:900px){.wrap{max-width:660px}.qcols{grid-template-columns:1fr;gap:16px}.qcol-l{position:static}}
  .topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);padding:14px 0 12px;margin-bottom:18px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em}
  .brand .tag{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;
    letter-spacing:.14em;font-weight:600}
  .meta{display:flex;align-items:center;gap:12px;margin-top:12px}
  .progress{flex:1;height:7px;background:var(--border);border-radius:99px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
    transition:width .35s ease}
  .score{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .score b{color:var(--ink)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 20px}
  .eyebrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
  .cat{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--accent);font-weight:650}
  .src{font-size:11px;color:var(--faint)}
  .qnum{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .prompt{font-size:16.5px;font-weight:600;margin:2px 0 14px;text-wrap:balance}
  pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:15.5px;
    line-height:1.65;padding:14px 15px;border-radius:10px;border:1px solid var(--border);
    overflow-x:auto;margin:0 0 18px;white-space:pre;tab-size:2}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;
    background:var(--surface-2);border:1.5px solid var(--border);border-radius:11px;
    padding:13px 14px;color:var(--ink);font-family:inherit;font-size:15px;line-height:1.5;
    transition:border-color .15s,background .15s,transform .05s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:active:not(:disabled){transform:translateY(1px)}
  .opt:disabled{cursor:default}
  .opt .key{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--muted);
    border:1.5px solid var(--border);border-radius:7px;min-width:26px;height:26px;display:flex;
    align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;transition:.15s}
  .opt .txt{flex:1;padding-top:1px;white-space:pre-wrap;overflow-wrap:anywhere}
  /* ★B案（2026-09-25 本人決定）: ○/× は出さない。正誤は色の3点で示す
     ―― 枠線(.opt.correct/.wrong) ・ 背景 ・ A/B/C/D バッジ(.key)の塗り。
     display:none なら flex の gap も生まれないので、回答の前後で幅が1pxも動かない。
     ★A案（min-width:1em で場所を空ける）は跳ね0だが、文字幅が1文字ぶん減る代償があった
       （oop 13/30問が縦に伸び、30問で+431px）。B案は代償ゼロ。
     実測 2026-09-25: ○=16.27px / ×=10.89px ＝ 正解と不正解でも幅が違っていた。
     ★下の .opt.correct .mark / .opt.wrong .mark は display:none に負けるので効かない。
       ○/× を戻したくなったらこの1行を消せば元に戻る（戻し方をここに残しておく）。
     ★もう1つの原因（縦スクロールバーで幅が15px縮む）は別で、scrollbar-gutter で直してある。
       2x2 の対照実験で2つが独立であることを確かめた。 */
  .opt .mark{display:none}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .key{border-color:var(--ok);background:var(--ok);color:#fff}
  .opt.correct .mark{opacity:1;color:var(--ok)}
  .opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
  .opt.wrong .key{border-color:var(--ng);background:var(--ng);color:#fff}
  .opt.wrong .mark{opacity:1;color:var(--ng)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .key{border-color:var(--accent);background:var(--accent);color:#fff}
  .multi-tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;
    color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:1px 6px;
    vertical-align:2px;white-space:nowrap}

  .verdict{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-weight:700;font-size:15px}
  .verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
  .exp{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;padding:13px 15px;font-size:14px;color:var(--ink);margin-top:6px}
  .exp code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:1px 5px;
    border-radius:4px;color:var(--code-ink)}
  .exp b{color:var(--ink)}
  .reveal{animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.reveal{animation:none}.progress>i{transition:none}}

  /* 図解（コード注釈） */
  .figure{margin-top:14px}
  .fig-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--faint);margin-bottom:6px;font-weight:650}
  .figbox{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:8px 0;
    overflow-x:auto;font-family:var(--mono);font-size:15.5px;line-height:1.3}
  .figline{display:flex;gap:10px;padding:0 12px;white-space:pre;min-width:max-content}
  .figline .fno{color:var(--faint);min-width:1.5em;text-align:right;flex:0 0 auto;user-select:none}
  .figline .fcode{color:var(--code-ink)}
  .figline.err{background:var(--ng-soft);box-shadow:inset 3px 0 0 var(--ng)}
  .figline.info{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .figline.ok{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}
  .figline.mute{box-shadow:inset 3px 0 0 var(--border)}
  .figline.mute .fcode{color:var(--faint)}
  /* 連結線つき注釈：該当行から L字の線＋矢印で枝分かれ */
  .annorow{position:relative;padding:3px 12px 9px 42px;min-width:max-content}
  .annorow::before{content:"";position:absolute;left:5px;top:-4px;width:17px;height:16px;
    border-left:2px solid currentColor;border-bottom:2px solid currentColor;border-bottom-left-radius:8px;opacity:.9}
  .annorow::after{content:"";position:absolute;left:20px;top:7px;width:0;height:0;
    border:5px solid transparent;border-left:7px solid currentColor;opacity:.9}
  .annorow.err{color:var(--ng)}
  .annorow.info{color:var(--accent)}
  .annorow.ok{color:var(--ok)}
  .annorow.mute{color:var(--faint)}
  .annorow .anno{font-family:var(--sans);font-size:12.5px;line-height:1.5;white-space:normal;max-width:46ch;display:block}
  .annorow.ok .anno{font-weight:600}
  .figout{margin-top:9px;font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:700}
  .figbox.qcode{margin:0 0 16px;font-size:15.5px}
  .qfigout{margin:8px 2px 16px}
  /* 変数トレース表（クリックで開閉） */
  .trace{margin-top:14px}
  .trace details{border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .trace summary{cursor:pointer;list-style:none;padding:9px 13px;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;
    background:var(--surface-2);display:flex;align-items:center;gap:8px;user-select:none}
  .trace summary::-webkit-details-marker{display:none}
  .trace summary::before{content:"▸";color:var(--accent)}
  .trace details[open] summary::before{content:"▾"}
  .trace summary:hover{color:var(--ink)}
  .trace summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tscroll{overflow-x:auto;border-top:1px solid var(--border)}
  .trace table{border-collapse:collapse;width:100%;font-size:12.5px}
  .trace th,.trace td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);
    padding:6px 10px;text-align:left;white-space:normal;vertical-align:top;overflow-wrap:anywhere}
  .trace th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);background:var(--surface-2);white-space:nowrap}
  .trace td{font-family:var(--mono);color:var(--code-ink);font-variant-numeric:tabular-nums}
  .trace td.st{font-family:var(--sans);color:var(--ink)}
  .trace tr.hot td{background:var(--ng-soft)}
  .trace .nul{color:var(--faint)}
  .trace tbody tr:last-child td{border-bottom:none}
  .trace th:last-child,.trace td:last-child{border-right:none}

  .actions{display:flex;gap:10px;margin-top:18px}
  .btn{font-family:inherit;font-size:14.5px;font-weight:600;border-radius:10px;padding:11px 18px;
    cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);
    transition:.15s;flex:0 0 auto}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;margin-left:auto}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.ghost{color:var(--muted)}

  /* results */
  .res-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .ring{--p:0;width:104px;height:104px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--border) 0);
    display:grid;place-items:center;position:relative}
  .ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
  .ring .num{position:relative;z-index:1;text-align:center}
  .ring .num b{font-size:26px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ring .num span{display:block;font-size:11px;color:var(--muted)}
  .res-sum h2{margin:0 0 4px;font-size:18px}
  .res-sum p{margin:0;color:var(--muted);font-size:13.5px}
  .sec-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--faint);margin:22px 0 10px;font-weight:650}
  .bars{display:flex;flex-direction:column;gap:11px}
  .bar-row .bar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .bar-row .bar-top .n{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .bar-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
  .bar-track>i{display:block;height:100%;border-radius:99px}
  .weak-badge{font-size:10.5px;font-family:var(--mono);color:var(--ng);border:1px solid var(--ng);
    border-radius:5px;padding:0 5px;margin-left:7px;vertical-align:1px}
  .advice{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
    margin-top:10px}
  .advice .a-cat{font-weight:650;font-size:14px;margin-bottom:3px;display:flex;align-items:center}
  .advice .a-txt{font-size:13.5px;color:var(--muted)}
  .advice+.advice{margin-top:8px}
  .empty{color:var(--muted);font-size:13.5px;padding:6px 0}
  .footer{margin-top:26px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.7}
  .footer .warn{color:var(--muted)}
  a.link{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  a.link:hover{border-color:var(--accent)}
</style>

  <div class="topbar">
    <div class="brand">
      <h1>Java Silver原作 演習コンソール</h1>
      <span class="tag">Java / 原作</span>

      <div class="progress"><i id="pbar"></i></div>

  </div>
</div>

<script>
/* ============================================================
   ▼▼▼ ここから下だけを科目ごとに差し替える（エンジン部は触らない） ▼▼▼
   自動生成: build_quizzes_v2.py（商用・オリジナル問題）
   ============================================================ */

// localStorage 保存キー：科目ごとに必ず変える（他科目と成績が混ざらないように）
const KEY='javaSilverOriginalQuizV1';

// 【単一選択】4択。answer は options の正解インデックス（0始まり）。
const BOOK_QUESTIONS = [
  {"id": "b1", "cat": "データ型", "src": "オリジナル", "prompt": "クラスのインスタンス変数(フィールド)として宣言した int を初期化しなかった場合の初期値はどれか。", "code": "", "options": ["1", "0", "null", "コンパイルエラー"], "answer": 1, "exp": "フィールドの int は明示的に初期化しなくても既定値 0 になる。一方メソッド内のローカル変数には既定値が無く、未初期化のまま使うとコンパイルエラーになる点に注意。"},

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderFigure(q){
  const f=FIGS[q.id]; if(!f) return '';
  const lines=q.code.split('\n');
  let rows='';
  lines.forEach((ln,idx)=>{
    const n=idx+1, an=f.lines[n], t=an?an[0]:'';
    rows+=`<div class="figline ${t}"><span class="fno">${n}</span><span class="fcode">${esc(ln)||' '}</span></div>`;
    if(an) rows+=`<div class="annorow ${t}"><span class="anno">${esc(an[1])}</span></div>`;
  });
  const out=f.out?`<div class="figout">▸ ${esc(f.out)}</div>`:'';
  return `<div class="figure reveal"><div class="fig-label">図解 — プログラムの流れ</div><div class="figbox">${rows}</div>${out}</div>`;
}

// 問題文のコードを、行番号つきの注釈可能ブロックとして描画（回答前は注釈なし）
function codeBlockHtml(q){
  if(!q.code) return '';
  const lines=q.code.split('\n');
  const rows=lines.map((ln,i)=>`<div class="figline" data-ln="${i+1}"><span class="fno">${i+1}</span><span class="fcode">${esc(ln)||' '}</span></div>`).join('');
  return `<div class="figbox qcode" id="qcode">${rows}</div>`;
}

// 回答後、問題文のコードに直接ハイライト＋連結線＋結果を差し込む
function revealFigure(q){
  // ★左へ回した選択肢には「注釈が入るぶんの高さ」を先に空けてある。ここで外すと相殺して動かない
  const oLx=document.querySelector('.leftfill'); if(oLx) oLx.style.marginTop='';
  const f=FIGS[q.id]; const box=document.getElementById('qcode');
  if(!f||!box) return;
  Object.keys(f.lines).sort((a,b)=>a-b).forEach(n=>{
    const t=f.lines[n][0], txt=f.lines[n][1];
    const line=box.querySelector('.figline[data-ln="'+n+'"]');
    if(!line) return;
    line.classList.add(t,'reveal');
    const ar=document.createElement('div'); ar.className='annorow '+t+' reveal';
    ar.innerHTML='<span class="anno">'+esc(txt)+'</span>';
    line.after(ar);
  });
  if(f.out){
    const o=document.createElement('div'); o.className='figout qfigout reveal';
    o.textContent='▸ '+f.out; box.after(o);
  }
}

function renderTrace(q){
  const t=TRACE[q.id]; if(!t) return '';
  const head=t.cols.map(c=>`<th>${esc(c)}</th>`).join('');
  const body=t.rows.map((r,ri)=>{
    const tds=r.map((c,ci)=>{
      const st=ci===r.length-1?' class="st"':'';
      let cell;
      if(c==='null') cell='<span class="nul">null</span>';
      else if(c==='') cell='<span class="nul">·</span>';
      else cell=esc(c);
      return `<td${st}>${cell}</td>`;
    }).join('');
    return `<tr class="${(t.hot!=null&&ri===t.hot)?'hot':''}">${tds}</tr>`;
  }).join('');
  return `<div class="trace reveal"><details class="tdet"><summary>変数の変化を追う（トレース）</summary><div class="tscroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></details></div>`;
}

// 選択肢が短ければ左(コード)を広く、選択肢が長ければ右(選択肢)を広く。
// インラインstyleではなくCSS変数 --gtc を渡すことで、900px以下のメディアクエリ(1カラム)を壊さない
// ★未使用（広いUIでは fitLayout() が実測で列幅を決める）。縦向きは .col-q/.col-a が
//   display:contents なので、この比率は誰も読まない。消さずに残してあるだけ
function qcolStyle(q){
  if(!q.code) return '';                                   // コード無しは .nocode の中央1カラムに任せる
  const w=s=>{let n=0;for(const ch of String(s)){n+=ch.charCodeAt(0)>0xff?2:1;}return n;}; // 全角=2,半角=1
  const optW=Math.max(1,...(q.options||['']).map(o=>Math.max(1,...String(o).split('\n').map(w)))); // 選択肢の最長行
  const codeW=Math.max(1,...q.code.split('\n').map(w));    // コードの最長行
  let l=1,r=1;
  if(optW<=16){l=1.8;r=1;}          // 選択肢がとても短い(記号/単語)→コードを大きく
  else if(optW<=26){l=1.4;r=1;}     // やや短い
  else if(optW>=60){l=1;r=1.6;}     // とても長い(文章/コード)→右を大きく
  else if(optW>=42){l=1;r=1.3;}     // やや長い
  if(codeW>=64)l+=0.35;             // コードが横に長い場合は左に加算
  return ` style="--gtc:minmax(0,${l}fr) minmax(0,${r}fr)"`;
}
// 回答時に revealFigure() が入るぶん、左へ回した選択肢が下がらないよう
// 空けておくべき margin-top を返す（既定は CSS と同じ 14px）。
// ★高さの足し算で見積もらない。.figout の margin-bottom(16px) と .opts-left の
//   margin-top(14px) が相殺するので、足し算だと必ず 2px 外れる（2026-09-24 実測）。
//   実際に同じ形を作って「置かれる位置」を前後で測る。
function reserveForReveal(box){
  try{
    if(!box) return {inner:0, outer:14};
    var q=QUESTIONS[queue[pos]], f=FIGS[q.id];
    var probe=document.createElement('div');
    // ★実際に置く箱と同じクラスにする。違うと margin が違って予約が外れる
    //   （2026-09-24: .opts-left のままにして 4px ずれた）
    probe.className='leftfill'; probe.style.height='0'; probe.style.minHeight='0';
    box.parentNode.insertBefore(probe, box.nextSibling);
    var top0=box.getBoundingClientRect().top;                 // 動かない基準
    var boxH0=box.getBoundingClientRect().height;             // 回答前のコード欄の高さ
    var tmp=[];
    if(f){
      Object.keys(f.lines||{}).forEach(function(nn){
        var line=box.querySelector('.figline[data-ln="'+nn+'"]'); if(!line) return;
        var ar=document.createElement('div'); ar.className='annorow '+f.lines[nn][0];
        ar.innerHTML='<span class="anno">'+esc(f.lines[nn][1])+'</span>';
        line.after(ar); tmp.push(ar);
      });
      if(f.out){
        var o=document.createElement('div'); o.className='figout qfigout';
        o.textContent='\u25b8 '+f.out; box.after(o); tmp.push(o);
      }
    }
    var after=probe.getBoundingClientRect().top-top0;
    var boxH1=box.getBoundingClientRect().height;             // 回答後のコード欄の高さ
    tmp.forEach(function(e){ e.remove(); });
    probe.remove();
    // ★「14 + 移動量」ではなく「回答後の位置 − 回答前のコード欄の高さ」。
    //   前者だと、回答前の隔たりが figbox の margin-bottom(16px) に支配されるぶん
    //   2px 足りなくなる（2026-09-24 実測: block では 2px ずれ／grid では合う）
    // ★さらに「箱の中(注釈の行)」と「箱の外(▸結果の行)」に分ける。
    //   中のぶんを空白として空けると、左へ回した選択肢がコードから離れて浮く
    //   （2026-09-25 指摘 #70「dの選択肢の位置がおかしい」で 220px 浮いていた）。
    //   中のぶんはコード欄自身の min-height にすれば、選択肢はコードのすぐ下に付く
    var inner=Math.max(0, Math.round(boxH1-boxH0));
    return {inner:inner, outer:Math.max(14, Math.round(after-boxH0-inner))};
  }catch(e){ return {inner:0, outer:14}; }
}

function fitLayout(force){
  var card=document.querySelector('.qcard'); if(!card) return;
  if(!force && card.dataset.laid==='1') return;
  // ★回答した後は測り直さない（2026-09-24 実測）。
  //   回答すると注釈でコード欄が伸びるので、その状態で測ると別の結論が出て
  //   「左へ回した選択肢の数」が回答の前後で変わる（実測 Q68 で 1個→2個）。
  //   幅が変わった時だけはやり直す（画面の回転・ウインドウ操作）。
  var answered = !!card.querySelector('.opt.correct, .opt.wrong');
  if(answered && card.dataset.laidW === String(innerWidth)) return;
  card.dataset.laid='1'; card.dataset.laidW=String(innerWidth);
  // ★左の列へ回した「選択肢・質問欄」を、測る前に元へ戻す（幅が変われば回す量も変わる）
  var oldF=card.querySelector('.leftfill');
  if(oldF){
    var o0=card.querySelector('.opts'), ca0=card.querySelector('.col-a');
    var oL0=oldF.querySelector('.opts-left');
    if(oL0&&o0){ while(oL0.firstChild){ o0.appendChild(oL0.firstChild); } }
    var ab0=oldF.querySelector('.askbox');
    if(ab0&&ca0){ ca0.appendChild(ab0); }      // 質問欄は col-a の一番後ろが元の位置
    oldF.remove();
  }
  var bx0=card.querySelector('.col-q .figbox'); if(bx0) bx0.style.minHeight='';   // ★前回の予約を消してから測る
  card.style.gridTemplateColumns=''; card.style.width=''; card.style.maxWidth='';  // 測る前に前回の指定を消す
  card.classList.remove('wideq');
  var pr0=card.querySelector('.prompt'); if(pr0){ pr0.style.maxWidth=''; pr0.style.width=''; }
  var eb0=card.querySelector('.col-q > .eyebrow'); if(eb0) eb0.style.width='';
  var colA=card.querySelector('.col-a'); if(colA) colA.style.paddingTop='';
  var st0=document.getElementById('stage'); if(st0) st0.style.paddingTop='';
  if(!matchMedia('(min-width:820px) and (pointer:fine) and (hover:hover) and (not (any-pointer:coarse)), (min-width:660px) and (orientation:landscape)').matches){
    card.classList.remove('onecol'); centerVertically(); return; }
  // ★コードが無い問題は、収まらなくても左右に割らない（左半分が丸ごと空になるため）
  var box=card.querySelector('.col-q .figbox');
  var opts=card.querySelector('.opts');
  if(!box){
    card.classList.add('onecol','nofig');
    // 選択肢が4つ以上のときだけ2列。3つ以下は1:2に割れて不格好なので1列のまま
    var n=opts?opts.children.length:0;
    if(opts){
      // ★2列にするかは幅の決め打ちではなく「中身の実幅」で決める（2026-09-24 指摘）。
      //   一番幅の広い選択肢が列幅に収まる（＝2列にしても折り返しが増えない）ときだけ2列。
      //   ★.opt には width:100% が効いているので、親だけ max-content にしても
      //     「100%＝グリッド領域の幅」が返る。子を1つずつ max-content にして測る。
      var two = n>=4, natMax=0;
      if(opts.children.length){
        opts.classList.remove('two');
        [].forEach.call(opts.children,function(e){ e.style.gridColumn=''; e.style.gridRow=''; });
        var full=opts.getBoundingClientRect().width;
        var kids0=[].slice.call(opts.children), kw0=[];
        kids0.forEach(function(e){ kw0.push(e.style.width); e.style.width='max-content'; });
        kids0.forEach(function(e){ var w=e.getBoundingClientRect().width; if(w>natMax) natMax=w; });
        kids0.forEach(function(e,i){ e.style.width=kw0[i]; });
        if(two) two = natMax <= (full-12)/2 + 1;   // gap 12 を引いた列幅に収まるか
      }
      // ★カードを左右いっぱいに伸ばさない（2026-09-24 指摘 #56
      //   「左右目一杯じゃなくて適度に余白減らしてほしい」）。
      //   一番広い選択肢の実幅から必要なぶんだけ取り、CSSの上限 1280 の内側に収める。
      //   下限 820 は、問題文が左列で2行に収まる程度の幅を確保するため
      //   （これより狭いと選択肢Cを問題文の横に置けなくなる。#57）
      if(natMax>0){
        var PADX=36;                                   // .qcard の左右 padding 18*2
        var wantW=(two ? natMax*2+12 : natMax)+PADX;
        card.style.maxWidth=Math.max(820, Math.min(1280, Math.ceil(wantW)))+'px';
      }
      opts.classList.toggle('two', two);
      opts.style.marginTop='';
      // ★1つずつ列と段を指定する。grid-auto-flow:column に段数を渡す書き方だと
      //   5個が 2/2/1 の「3列」に溢れる（2026-09-24 実測）。左は floor(n/2) 個。
      var k=Math.floor(n/2);
      var place=function(lift){
        [].forEach.call(opts.children,function(e,i){
          if(!two){ e.style.gridColumn=''; e.style.gridRow=''; return; }
          e.style.gridColumn = (i<k) ? '1' : '2';
          // lift のときは左を2段目から始めて、1段目を右列だけにする
          e.style.gridRow    = (i<k ? i + (lift?2:1) : i-k+1);
        });
      };
      place(false);
      if(two){
        // ★選択肢が偶数のときは持ち上げない＝AとCを隣に並べる（2026-09-24 指摘）。
        //   持ち上げるのは「奇数」か「持ち上げないと1画面に収まらない」ときだけ。
        //   （奇数だと右列が1つ多くなるので、持ち上げた方が左右の段数が揃う）
        // ★持ち上げるのは奇数のときだけ。偶数は「AとCを隣」が本人指示（2026-09-24 #21）。
        //   以前あった「1画面に収まらないなら持ち上げる」の逃げ道は廃止した。
        //   #58（n=4）で偶数なのに持ち上がり、しかも縦はむしろ伸びていた
        var wantLift = (n % 2 === 1);
        // 右列を問題文の高さぶん持ち上げ、選択肢Cが問題文の右に並ぶようにする。
        // ★問題文が右列の領域まで伸びている問題では重なるので持ち上げない。
        var pr=wantLift ? card.querySelector('.prompt') : null;
        if(pr){
          var ob0=opts.getBoundingClientRect();
          var colW=(ob0.width-12)/2;                        // 片列の幅
          var colR=ob0.left + colW + 12;                    // 右列の左端（gap 12）
          var maxR=function(){
            var rg=document.createRange(); rg.selectNodeContents(pr);
            var m=0; [].forEach.call(rg.getClientRects(),function(q){ if(q.right>m) m=q.right; });
            return m; };
          // ★問題文が右列まで伸びているなら、左列の幅で折り返させる
          //   （2026-09-24 指摘 #57「問題文を折り返して左側に収めて、cの選択肢を上にずらして」）。
          //   本人の許可は「2行まで」。3行以上になるなら折り返しをやめ、持ち上げもしない
          //   （本人 2026-09-24「問題文が入らないなら2行に折り返すとかして」）
          if(maxR()+16>colR){
            var lh=parseFloat(getComputedStyle(pr).lineHeight)||28;
            pr.style.maxWidth=Math.floor(colW-16)+'px';
            if(pr.getBoundingClientRect().height > lh*2.4) pr.style.maxWidth='';
          }
          var pb=pr.getBoundingClientRect(), ob=opts.getBoundingClientRect();
          var dy=Math.round(ob.top-pb.top);
          // ★問題文の横に来る選択肢（＝C）の方がずっと背が高いと、
          //   持ち上げた結果 問題文の下に大きな空白ができる（2026-09-24 指摘 #58/#59）。
          //   背の差が 40px を超えるなら持ち上げない。
          //   実測: #56 は差 33px（本人「いい感じ」）／#59 は 101px／#58 は 191px
          //   ★#62 で左右の高さを揃えているので、測る間だけ揃えを外して素の高さを見る。
          //     揃えたままだと、C が左の A に引き伸ばされた高さで判定してしまう
          opts.style.alignItems='start';
          var rc=opts.children[Math.floor(n/2)];        // 右列の1つ目（＝C）
          var gapH=rc ? Math.round(rc.getBoundingClientRect().height - pb.height) : 0;
          opts.style.alignItems='';
          if(dy>0 && maxR()+16<=colR && gapH<=40){ place(true); opts.style.marginTop=(-dy)+'px'; }
          else pr.style.maxWidth='';
        }
      }
    }
    centerVertically();
    return;
  }
  card.classList.remove('nofig');
  if(opts){ opts.classList.remove('two'); opts.style.gridTemplateRows=''; opts.style.marginTop='';
    [].forEach.call(opts.children,function(e){e.style.gridColumn='';e.style.gridRow='';}); }
  card.classList.add('onecol');                       // まず1列で測る
  if(document.documentElement.scrollHeight <= innerHeight + 2){ centerVertically(); return; }  // 1列で収まった
  card.classList.remove('onecol');
  // 2列にするときは、左の列をコードの実幅ぶんにし、
  // 余った幅は右へ回さずカードごと縮めて中央へ寄せる。
  // 上限/下限を付けないと、1行だけ極端に長いコードで右が潰れる
  var w=0;
  box.querySelectorAll('.fcode').forEach(function(e){
    var r=e.getBoundingClientRect(); if(r.width>w) w=r.width; });
  var no=box.querySelector('.fno');
  var lead=no?no.getBoundingClientRect().width:24;
  var avail=card.clientWidth;
  var GAP=24, PAD=36;                                  // column-gap と カード左右padding(18*2)
  var need=Math.ceil(w+lead+64);   // 64 = 行の左右padding(18*2)+番号との隙間(10)+遊び(18)
  // ★左右に割るだけの幅が無いなら割らない（2026-09-24 指摘「文字のレイアウトに対して動的に」）。
  //   無理に割ると、コードが列からはみ出して右端が切れる
  //   （実測 1000px幅で コード右余白 -215px・選択肢の右の余り -305px）。
  //   縦に長くなっても1列のままの方が読める。
  var MINOPT=300;                                      // 選択肢の列として最低限使える幅
  if(need + GAP + PAD + MINOPT > avail){
    card.classList.add('onecol');
    if(opts){ opts.classList.remove('two'); opts.style.marginTop='';
      [].forEach.call(opts.children,function(e){e.style.gridColumn='';e.style.gridRow='';}); }
    centerVertically(); return;
  }
  // ★下限320 も上限0.66 も『カードに収まること』より優先してはいけない。
  //   2026-09-24 実測: 1280px で コードが列から19px はみ出し（0.66の上限が噛んだ）／
  //   667px 横向きで need も right も下限320に張り付き、合計700px>614px で横スクロールが出た。
  //   CAP = 右に MINOPT を残したうえで左に回せる最大。ここを超えたら はみ出すしかない。
  var CAP=avail-GAP-PAD-MINOPT;              // 上の関門を通った時点で needRaw<=CAP
  need=Math.min(Math.max(320, need), CAP);
  // ★右（選択肢）も"中身の実幅"で決める。固定幅にすると
  //   「[a, b, c]」のような短い選択肢のとき右半分がまるごと空白になる（2026-09-24 指摘）。
  //   max-content で折り返さない時の幅を測り、上下限で挟む
  var right=420;
  if(opts){
    // ★子の .opt に width:100% が効いているので、親だけ max-content にしても
    //   「100% = グリッド領域の幅」がそのまま返る（＝測定が効かない。2026-09-24 実測で発覚）。
    //   子にも max-content を当てて、本当の中身の幅を出す。
    var keep=opts.style.width, kids=[].slice.call(opts.children), kw=[];
    kids.forEach(function(e){ kw.push(e.style.width); e.style.width='max-content'; });
    opts.style.width='max-content';
    right=Math.ceil(opts.getBoundingClientRect().width);
    opts.style.width=keep;
    kids.forEach(function(e,i){ e.style.width=kw[i]; });
    right=Math.min(660, Math.max(280, right+12));
  }
  right=Math.min(right, avail-need-GAP-PAD);   // ★下限を置かない（need<=CAP なので必ず MINOPT 以上 残る）
  card.style.gridTemplateColumns='minmax(0,'+need+'px) minmax(0,'+right+'px)';
  card.style.width=Math.min(avail, need+GAP+right+PAD)+'px';   // margin:auto で中央へ
  // ★左の列が細いと、問題文が1行 数文字ずつで折り返して右が大きく空く（2026-09-24 指摘）。
  //   「左列に入る全角の文字数」＝ 列の幅 ÷ 1文字の幅 が MIN_CHARS 未満のときだけ、
  //   見出し行と問題文をカード幅いっぱいに伸ばす（.wideq）。コードと選択肢の列はそのまま。
  var MIN_CHARS=28;
  var pr2=card.querySelector('.prompt');
  if(pr2){
    var fs=parseFloat(getComputedStyle(pr2).fontSize)||17;
    if(fs>0 && need/fs < MIN_CHARS){
      card.classList.add('wideq');
      // ★カードの中身の幅いっぱいに広げる（グリッドの列をまたがず、はみ出させる）。
      //   列をまたがせる（display:contents + grid-column:1/-1）と、.col-a が
      //   複数行にまたがって高さを奪い合い、回答後に位置が動く
      var wide=need+GAP+right;
      pr2.style.width=wide+'px';
      var eb=card.querySelector('.col-q > .eyebrow'); if(eb) eb.style.width=wide+'px';
    }
  }
  // ★選択肢Aの上端を、左のコード欄の上端に合わせる。
  //   左の列は「見出し＋設問文」が上に乗るぶんコード欄が下がるので、その差を右に足す。
  //   ここは幅を確定させた後でないと、設問文の折り返し行数が変わって値がずれる。
  centerVertically();          // ★先に中央寄せ。高さが変わるので揃えはその後
  if(colA){
    // ★基準は「右列の上端」ではなく「選択肢Aの箱の上端」。
    //   1回の計算で決め打ちすると、padding を入れた反動で折り返しが変わり 7px 残る
    //   （2026-09-24 実測 0/66）。合うまで測り直す（最大3回）。
    var ref=(opts&&opts.children[0])||colA, cur=0;
    for(var it=0; it<5; it++){
      var d=Math.round(box.getBoundingClientRect().top - ref.getBoundingClientRect().top);
      if(Math.abs(d)<=1) break;
      cur=Math.max(0, cur+d);
      colA.style.paddingTop=cur+'px';
    }
  }
  // ★コードの下が大きく余るなら、右の列から左へ回して余りを埋める。
  //   ① 質問欄（2026-09-24 指摘 #66）… 読む順を崩さないのでこちらを先に
  //   ② 選択肢の後ろ何個か（2026-09-24 指摘 #61）
  //   どちらも「カードの高さが 8px 以上 縮むとき」だけ実行し、縮まなければ戻す。
  //   回す数は決め打ちしない（左の列が細いと折り返して逆に伸びるため）。
  if(colA && opts){
    var colQ=card.querySelector('.col-q');
    // ★回答済みなら注釈はもう入っているので予約しない（二重に空けてしまう）
    var rsv = answered ? {inner:0,outer:14} : reserveForReveal(box);
    var boxH0=Math.round(box.getBoundingClientRect().height);
    var rightW=Math.round(opts.getBoundingClientRect().width);
    var fill=null;
    // ★予約枠(marginTop)を付けるのは「選択肢」を回すときだけ。
    //   質問欄は"回答の選択肢"ではないので、回答時に注釈で下がってよい。
    //   予約したままだとコードのすぐ下が大きく空く（2026-09-24 指摘 #69
    //   「これもうちょっと質問欄上にできない？」）
    var ensureFill=function(reserve){
      if(!fill){ fill=document.createElement('div'); fill.className='leftfill'; colQ.appendChild(fill); }
      // ★予約は2つに分ける: 箱の中のぶんは コード欄の min-height、
      //   箱の外のぶん（▸結果の行）だけを余白で取る
      fill.style.marginTop = reserve ? rsv.outer+'px' : '';   // '' = CSS既定の 14px
      box.style.minHeight  = reserve ? (boxH0+rsv.inner)+'px' : '';
      return fill; };
    var dropFill=function(){ if(fill && !fill.children.length){ fill.remove(); fill=null; } };
    var leftBot=function(){ var b=box.getBoundingClientRect().bottom;
      if(fill){ var r=fill.getBoundingClientRect(); if(r.bottom>b) b=r.bottom; }
      return b; };
    var cardH=function(){ return Math.max(leftBot(), colA.getBoundingClientRect().bottom)
                                 - card.getBoundingClientRect().top; };
    var h0=cardH();
    // ★順番は「選択肢 → 質問欄」。逆にすると、予約の無い質問欄が先に空白を埋めてしまい、
    //   選択肢を回しても高さが縮まなくなる（2026-09-24 実測: 選択肢の移動が12問→1問に激減）
    // ① 選択肢（末尾から1つずつ。右に最低2つ残す）… 回答の前後で動いてはいけないので予約する
    var oL=null;
    if(opts.children.length>=4){
      var best=h0, bestK=0, k=0;
      while(opts.children.length>2){
        if(!oL){ oL=document.createElement('div'); oL.className='opts-left';
          oL.style.maxWidth=rightW+'px';
          ensureFill(true); fill.appendChild(oL); }
        oL.insertBefore(opts.lastElementChild, oL.firstChild);   // 末尾から・順序は保つ
        k++;
        var hk=cardH();
        if(hk < best-1){ best=hk; bestK=k; } else break;
      }
      if(h0-best < 8) bestK=0;   // ★40→8。実測(2026-09-24) Q4 は移せば20px縮むのに
                             //   40px の下限で却下され、186px の空白が残っていた
      while(oL && k>bestK){ opts.appendChild(oL.firstElementChild); k--; }
      if(oL && bestK===0){ oL.remove(); oL=null;
        if(fill) fill.style.marginTop=''; box.style.minHeight=''; dropFill(); }
      else h0=cardH();
    }
    // ② 質問欄 … 選択肢の後ろへ。選択肢を回していないなら予約せずコードのすぐ下（#69）
    var ask=colA.querySelector(':scope > .askbox');
    if(ask){
      ensureFill(!!oL).appendChild(ask);
      if(cardH() >= h0-8){ colA.appendChild(ask);
        if(!oL && fill){ fill.style.marginTop=''; box.style.minHeight=''; } dropFill(); }
    }
  }
  // ★揃えの padding でカードの高さが変わるので、中央寄せを取り直す。
  //   カードの中の位置関係は動かないので、揃えは壊れない。
  //   2026-09-24 実測: 2056x1329 で Q19/28/33/48/77 が上下 25〜63px ずれていた
  centerVertically();
}

// 1画面に収まる問題は、上に貼り付かず縦の中央へ。
// ★収まらない問題では何もしない（中央寄せで上が画面外に切れると戻せなくなる）
function centerVertically(){
  var st=document.getElementById('stage'), wp=document.querySelector('.wrap');
  if(!st||!wp) return;
  st.style.paddingTop='';
  if(!matchMedia('(min-width:820px) and (pointer:fine) and (hover:hover) and (not (any-pointer:coarse)), (min-width:660px) and (orientation:landscape)').matches) return;
  // ★body の padding（下 76px＝左下ボタンのぶん）と margin を数に入れる。
  //   入れないと「余りがある」と誤判定して padding を足し、結局スクロールが出る
  //   （2026-09-24 実測: 1512幅で 72問中 39問が「収まらないのに中央寄せ済み」）
  var bs=getComputedStyle(document.body);
  var extra=(parseFloat(bs.paddingTop)||0)+(parseFloat(bs.paddingBottom)||0)
           +(parseFloat(bs.marginTop)||0)+(parseFloat(bs.marginBottom)||0);
  var free=Math.round(innerHeight - wp.getBoundingClientRect().height - extra);
  if(free>1) st.style.paddingTop=Math.round(free/2)+'px';   // ★8→1。8px の遊びが
  //   そのまま上下のズレとして残っていた（2026-09-24 実測 Q56 で 7px）
}
addEventListener('resize', function(){ fitLayout(true); });   // 画面幅が変わった時だけ測り直す

function renderQuestion(){
  answered=false; selected=new Set();
  const q=QUESTIONS[queue[pos]];
  pbar.style.width=(pos/queue.length*100)+'%';
  scoreEl.innerHTML='<b>'+sessCorrect+'</b> / '+sessDone+' 正解';
  stage.innerHTML=`
    <div class="card reveal qcard">
      <div class="col-q">
      <div class="eyebrow">
        <span class="cat">${esc(q.cat)}</span>
        <span class="qnum">${pos+1} / ${queue.length}</span>
      </div>
      <div class="prompt">${esc(q.prompt)} ${q.multi?'<span class="multi-tag">複数選択</span>':''}</div>
      ${codeBlockHtml(q)}
      </div>
      <div class="col-a">
      <div class="opts" id="opts"></div>
      <div id="after"></div>
      </div>
    </div>`;
  const opts=document.getElementById('opts');
  const order=shuffle(q.options.map((_,i)=>i));   // 毎回シャッフル
  q._order=order;
  order.forEach((origIdx,dispIdx)=>{
    const b=document.createElement('button');
    b.className='opt'; b.type='button'; b.dataset.i=dispIdx;   // ★列を移しても番号で判定できるように
    b.innerHTML=`<span class="key">${LETTERS[dispIdx]}</span><span class="txt">${esc(q.options[origIdx])}</span><span class="mark"></span>`;
    b.onclick=()=> q.multi ? toggleSel(dispIdx,b) : choose(dispIdx);
    opts.appendChild(b);
  });
  if(q.multi){
    const bar=document.createElement('div'); bar.className='actions'; bar.id='mbar';
    bar.innerHTML=`<button class="btn primary" type="button" id="submitBtn" onclick="submitMulti()" disabled>確定する（${q.answers.length}個選ぶ）</button>`;
    opts.after(bar);
  }
}

function toggleSel(dispIdx,btn){
  if(answered) return;
  if(selected.has(dispIdx)){selected.delete(dispIdx);btn.classList.remove('sel');}
  else{selected.add(dispIdx);btn.classList.add('sel');}
  const sb=document.getElementById('submitBtn'); if(sb) sb.disabled = selected.size===0;
}

function submitMulti(){
  if(answered) return; answered=true;
  const q=QUESTIONS[queue[pos]];
  const correctDisp=new Set(q.answers.map(a=>q._order.indexOf(a)));
  const correct = selected.size===correctDisp.size && [...selected].every(x=>correctDisp.has(x));
  document.querySelectorAll('.qcard .opt').forEach(b=>{
    const bi=+b.dataset.i;                    // ★並び順ではなく表示番号で判定
    b.disabled=true; b.classList.remove('sel');
    const isC=correctDisp.has(bi), isS=selected.has(bi);
    if(isC){b.classList.add('correct');b.querySelector('.mark').textContent='○';}
    if(isS&&!isC){b.classList.add('wrong');b.querySelector('.mark').textContent='×';}
  });
  const mbar=document.getElementById('mbar'); if(mbar) mbar.remove();
  const s=load();
  s.perCat[q.cat]=s.perCat[q.cat]||{a:0,c:0};
  s.perCat[q.cat].a++; if(correct)s.perCat[q.cat].c++;
  s.log.push({id:q.id,cat:q.cat,correct,t:Date.now()});
  save(s);
  sessDone++; if(correct)sessCorrect++;
  scoreEl.innerHTML='<b>'+sessCorrect+'</b> / '+sessDone+' 正解';
  const answerLetters=[...correctDisp].sort((a,b)=>a-b).map(i=>LETTERS[i]).join('・');
  const last=pos===queue.length-1;
  document.getElementById('after').innerHTML=`
    <div class="verdict ${correct?'ok':'ng'} reveal">${correct?'○ 正解':'× 不正解'} <span style="font-weight:500;color:var(--muted);font-size:13px">正解は ${answerLetters}</span></div>
    <div class="exp reveal">${q.exp}</div>
    ${renderTrace(q)}
    <div class="actions">
      <button class="btn ghost" type="button" onclick="showResults()">成績を見る</button>
      <button class="btn primary" type="button" onclick="next()">${last?'結果へ →':'次の問題 →'}</button>
    </div>`;
  revealFigure(q);
}

function choose(i){
  if(answered) return;
  answered=true;
  const q=QUESTIONS[queue[pos]];
  const correctDisp=q._order.indexOf(q.answer);   // シャッフル後の正解位置
  const correct=i===correctDisp;
  // ★選択肢の一部を左の列へ移すので #opts の中だけを見ない。並び順でなく data-i で判定
  const btns=document.querySelectorAll('.qcard .opt');
  btns.forEach(b=>{
    const bi=+b.dataset.i;
    b.disabled=true;
    if(bi===correctDisp){b.classList.add('correct');b.querySelector('.mark').textContent='○';}
    if(bi===i&&!correct){b.classList.add('wrong');b.querySelector('.mark').textContent='×';}
  });
  // 記録（累積・端末保存）
  const s=load();
  s.perCat[q.cat]=s.perCat[q.cat]||{a:0,c:0};
  s.perCat[q.cat].a++; if(correct)s.perCat[q.cat].c++;
  s.log.push({id:q.id,cat:q.cat,correct,t:Date.now()});
  save(s);
  sessDone++; if(correct)sessCorrect++;
  scoreEl.innerHTML='<b>'+sessCorrect+'</b> / '+sessDone+' 正解';

  const after=document.getElementById('after');
  const last=pos===queue.length-1;
  after.innerHTML=`
    <div class="verdict ${correct?'ok':'ng'} reveal">${correct?'○ 正解':'× 不正解'} <span style="font-weight:500;color:var(--muted);font-size:13px">正解は ${LETTERS[correctDisp]}</span></div>
    <div class="exp reveal">${q.exp}</div>
    ${renderTrace(q)}
    <div class="actions">
      <button class="btn ghost" type="button" onclick="showResults()">成績を見る</button>
      <button class="btn primary" type="button" onclick="next()">${last?'結果へ →':'次の問題 →'}</button>
    </div>`;
  revealFigure(q);
}

function next(){
  if(pos<queue.length-1){pos++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
  else showResults();
}

function showResults(){
  pbar.style.width='100%';
  const s=load();
  const cats=Object.keys(ADVICE);
  let totA=0,totC=0;
  cats.forEach(c=>{const d=s.perCat[c];if(d){totA+=d.a;totC+=d.c;}});
  const pct=totA?Math.round(totC/totA*100):0;
  const weak=cats.filter(c=>{const d=s.perCat[c];return d&&d.a>0&&(d.c/d.a)<0.7;});

  let barsHtml=cats.map(c=>{
    const d=s.perCat[c]||{a:0,c:0};
    const p=d.a?Math.round(d.c/d.a*100):0;
    const isWeak=d.a>0&&p<70;
    const col=d.a===0?'var(--border)':(p<50?'var(--ng)':p<70?'var(--accent)':'var(--ok)');
    return `<div class="bar-row">
      <div class="bar-top"><span>${esc(c)}${isWeak?'<span class="weak-badge">要復習</span>':''}</span>
      <span class="n">${d.a?p+'% ('+d.c+'/'+d.a+')':'未回答'}</span></div>
      <div class="bar-track"><i style="width:${d.a?p:0}%;background:${col}"></i></div></div>`;
  }).join('');

  let msg = totA===0?'まだ回答がありません。':
    pct>=80?'かなり good。取りこぼした分野だけ詰めれば合格圏です。':
    pct>=60?'あと一歩。下の「要復習」分野を重点的に。':
    '基礎の詰め直しから。要復習の分野を1つずつ潰しましょう。';

  let adviceHtml = weak.length
    ? weak.map(c=>`<div class="advice"><div class="a-cat">${esc(c)} <span class="weak-badge">要復習</span></div><div class="a-txt">${esc(ADVICE[c])}</div></div>`).join('')
    : (totA?'<div class="empty">要復習の分野はありません。全分野70%以上。この調子！</div>':'<div class="empty">問題を解くと、ここに弱点分野と対策が出ます。</div>');

  stage.innerHTML=`
   <div class="card reveal">
     <div class="res-head">
       <div class="ring" style="--p:${pct}"><div class="num"><b>${pct}%</b><span>累計正答率</span></div></div>
       <div class="res-sum"><h2>成績サマリー</h2><p>${msg}</p>
         <p style="margin-top:6px">累計 ${totC} / ${totA} 問正解</p></div>
     </div>
     <div class="sec-label">分野別の正答率</div>
     <div class="bars">${barsHtml}</div>
     <div class="sec-label">重点対策（要復習の分野）</div>
     ${adviceHtml}
     <div class="actions">
       <button class="btn ghost" type="button" onclick="resetAll()">記録をリセット</button>
       ${weak.length?'<button class="btn" type="button" onclick="retryWeak()">要復習だけ再挑戦</button>':''}
       <button class="btn primary" type="button" onclick="restart()">もう一度：全問</button>
     </div>
   </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){queue=QUESTIONS.map((_,i)=>i);pos=0;sessCorrect=0;sessDone=0;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function retryWeak(){
  const s=load();
  const weak=Object.keys(ADVICE).filter(c=>{const d=s.perCat[c];return d&&d.a>0&&(d.c/d.a)<0.7;});
  const idx=QUESTIONS.map((q,i)=>i).filter(i=>weak.includes(QUESTIONS[i].cat));
  queue=idx.length?idx:QUESTIONS.map((_,i)=>i);
  pos=0;sessCorrect=0;sessDone=0;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
}
function resetAll(){save({perCat:{},log:[]});showResults();}

renderQuestion();
</script>

    display:flex;flex-wrap:wrap;gap:12px;align-items:center}

    border:1px solid var(--border);margin-right:5px;vertical-align:-1px}
  .cbtlegend i.ok{background:var(--ok-soft);border-color:var(--ok)}
  .cbtlegend i.ng{background:var(--ng-soft);border-color:var(--ng)}
  .cbtlegend i.fl{background:var(--accent)}

    border:0;border-radius:999px;padding:9px 16px;cursor:pointer}

  /* 問題カード右上の「後で見直す」 */
  .cbtflag{font:500 12px/1 var(--sans);color:var(--muted);background:var(--surface);
    border:1px solid var(--border);border-radius:999px;padding:6px 11px;cursor:pointer;margin-left:auto}
  .cbtflag.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .cbtprev{font:400 12px/1 var(--sans);color:var(--muted);margin-left:8px}

  /* 左下のボタンが最下部の内容に重ならないよう余白を足す */
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  @media (max-width:640px){
    .cbtopen{left:10px;bottom:10px;padding:11px 16px}
    .cbtgrid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
    .cbtscreen{padding:10px}
  }
  /* ===== ここから 広いUI（Mac / iPad・iPhone横向き）。java-silver から移植 ===== */
  /* ★縦向き/狭い画面: もとの .qcols（1列・gap 16px）と同じ積み方・同じ隙間を保つ。
     .col-q=見出し+設問文+コード / .col-a=選択肢。広いUIのときだけ下の @media が上書きする。
     ★row-gap を使うのは、コードが無い問題でも隙間が消えないため（旧レイアウトでは
       空の .qcol-l が1行を占めていた。display:contents だと 16px 詰まる＝実測） */
  .qcard{display:grid;grid-template-columns:minmax(0,1fr);row-gap:16px}
  .col-q,.col-a{min-width:0}
  @media (min-width:820px) and (pointer:fine) and (hover:hover) and (not (any-pointer:coarse)), (min-width:660px) and (orientation:landscape){
    /* 左右の余白を詰める（18px→10px）。画面が広いほど本文に回す */
    /* 縦スクロールバーの幅を常に確保する。問題ごとに出たり消えたりすると
       実効幅が15px変わってレイアウトが横に跳ねるため。
       ★揃えのズレ(7px)の原因ではなかった（A/Bで棄却。真因は decorate()）*/
    html{scrollbar-gutter:stable}
    /* 左paddingだけ厚くして中身を気持ち右へ寄せる（2026-09-24 指摘）*/
    .wrap{max-width:1900px;padding:4px 8px 10px 28px}
    /* ★縦中央寄せに min-height:100vh / flex は使わない。
       scrollHeight が常に viewport 以上になり、「1列で1画面に収まるか」の
       判定が必ず失敗する（2026-09-24 実測: 全80問が2列・2つの幅で数値が完全一致）。
       余りの半分を #stage の padding-top に入れる形で fitLayout() が行う */
    /* 問題画面は1画面に収める（上下スクロールを出さない）。
       :has が無いブラウザでは従来どおり縦に伸びるだけで壊れない */
    /* ★スクロールはページ全体で1本だけ。列ごとに出さない
       （1画面に収まる問題ではそもそもスクロールバーが出ない） */
    .qcard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
      column-gap:24px;align-items:start;padding:14px 18px;margin-left:auto;margin-right:auto}
    .col-q,.col-a{display:block;min-width:0}
    /* ★左の列が細くて問題文が1行あたり数文字しか入らない時だけ、見出し行と
       問題文をカード幅いっぱいに伸ばす（2026-09-24 指摘）。判定は fitLayout()。
       コードが細い問題だと問題文まで左の狭い列に押し込まれ、3行に折り返して
       右側が大きく空いていた。.col-q を display:contents にして
       その子（eyebrow / prompt / figbox）を直接グリッドに載せる。
       ★display:block より後ろ かつ セレクタが詳しいので、こちらが勝つ */
    /* ★display:contents は使わない（2026-09-24 に2度 痛い目を見た）。
       子が直接グリッド項目になるため、
         ① 後から増えた子（図解・回した選択肢）が自動配置で他とぶつかる（#54）
         ② .col-a が複数行にまたがり、回答して解説が伸びると行の高さを奪い合って
            コードや選択肢が動く（実測 最大19px）
       代わりに .col-q は普通の1マスのまま、見出しと問題文だけを
       右の列の上へ「はみ出させる」（幅は fitLayout() が px で入れる）。
       右の列の上端は揃え処理でコード欄の高さまで下げてあるので重ならない */
    .qcard.wideq:not(.onecol) .col-q > .eyebrow,
    .qcard.wideq:not(.onecol) .col-q > .prompt{max-width:none}
    /* ★コードの下が余るとき、右の列から「質問欄」と「後ろの選択肢」をここへ回す。
       　 2026-09-24 指摘 #61「左の下半分が余ってるから、右の選択肢を2つくらい左に持ってきてほしい」
       　 2026-09-24 指摘 #66「例えばこういうのは質問欄をコードの下（左側）に持ってきて」
       margin-top は fitLayout() が「回答時に注釈が入るぶん」を予約する（回答の前後で動かさないため）*/
    /* ★display:flow-root（＝子とのマージン相殺を止める）。止めないと、中に入れた
       .askbox の margin-top:20px が親と相殺して、空の測定用ダミーとの間に
       20-16=4px の差が出る（2026-09-24 実測: 回答後に質問欄が4px下がった）*/
    .qcard:not(.onecol) .leftfill{display:flow-root;margin-top:14px}
    .qcard:not(.onecol) .leftfill > :first-child{margin-top:0}
    .qcard:not(.onecol) .leftfill > * + *{margin-top:20px}
    /* 回した選択肢の幅は右の列に合わせる（コード列いっぱいに伸ばすと左右で箱が揃わない）*/
    .qcard:not(.onecol) .opts-left{display:flex;flex-direction:column;gap:12px}
    /* 左右に割るのは「1カラムだと1画面に収まらない問題」だけ。
       行数の閾値では決めない（勘になる）。実測して fitLayout() が onecol を付け外しする */
    .qcard.onecol{display:block;max-width:1100px;margin-left:auto;margin-right:auto}
    .qcard.onecol .col-q,.qcard.onecol .col-a{display:contents}
    /* コードが無い問題（nofig）は縦一列だと間延びするので、選択肢だけ2列に並べる。
       設問文・質問欄・解説は全幅のまま（読む順が崩れるため） */
    .qcard.onecol.nofig{max-width:1280px}
    /* ★行方向(A B / C D / E)ではなく列方向(左A B / 右C D E)に流す。
       1列目の段数は選択肢の数から fitLayout() が決める（CSSでは割り算できない） */
    .qcard.onecol.nofig .opts.two{display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start;
      /* ★同じ段の左右は同じ高さにする（2026-09-24 本人指示 #62「この枠の大きさ、左は
         右の大きさに合わせて」／#63「こういうのも」＝6行のコード選択肢と並ぶ場合も同じ）。
         ★一時 align-items:start にしていたのは私の独断で、本人の指示ではなかった。
         stretch は grid の既定値なので、指定を書かないのが正解 */
      align-items:stretch}
    .card:not(.qcard){max-width:760px;margin-left:auto;margin-right:auto}
    .prompt{font-size:17px;margin-bottom:18px;line-height:1.7}
    /* 行間と余白を広げる（PCは画面に余裕があるので詰める必要がない）*/
    .figbox{line-height:1.7;padding:12px 0}
    /* コードの左右の余白。12pxだと「ピッタリすぎる」と言われたので18px（2026-09-24）*/
    .figline{padding:2px 18px}
    .opts{gap:12px}
    .opt{padding:15px 16px;line-height:1.65}
    .exp{line-height:1.85}
    /* ヘッダを1行にして縦を半分にする（題名とゲージを並べる）*/
    .topbar{display:flex;align-items:center;gap:22px;padding:3px 0 3px;margin-bottom:8px;flex:0 0 auto}
    .brand{flex:0 0 auto}
    .brand h1{font-size:14.5px}
    .meta{flex:1 1 auto;margin-top:0}
    .footer{margin-top:8px;flex:0 0 auto}
  }
</style>
<script>
(function(){
  // エンジンが読み込まれていない画面（雛形の説明ページ等）では何もしない
  if(typeof QUESTIONS==='undefined' || typeof renderQuestion!=='function') return;
  var stage=document.getElementById('stage');
  if(!stage || !QUESTIONS.length) return;

  // --- 進捗の保存（科目ごとに別キー。既存の成績データとは混ぜない） ---
  var CKEY=(typeof KEY!=='undefined'?KEY:'quiz')+'_cbt';
  var st={};
  try{ st=JSON.parse(localStorage.getItem(CKEY))||{}; }catch(e){ st={}; }
  function persist(){ try{ localStorage.setItem(CKEY,JSON.stringify(st)); }catch(e){} }

  var filter='all';

  // --- 左下のボタン（各問題ページに出るのはこれだけ） ---
  var openBtn=document.createElement('button');
  openBtn.type='button';
  openBtn.className='cbtopen';
  openBtn.textContent='問題選択画面';
  document.body.appendChild(openBtn);

  // --- 問題選択画面（全画面オーバーレイ） ---
  var scr=document.createElement('div');
  scr.className='cbtscreen';
  scr.hidden=true;
  scr.innerHTML=
    '<div class="cbtpanel" role="dialog" aria-modal="true" aria-label="問題選択画面">'
   +  '<div class="cbtpanel-head">'
   +    '<h2>問題を選ぶ</h2><span class="cbtcount" id="cbtCount"></span>'
   +    '<button type="button" class="cbtclose" id="cbtClose">閉じる</button>'
   +  '</div>'
   +  '<div class="cbtfilters">'
   +    '<button type="button" class="cbtchip on" data-f="all">すべて</button>'
   +    '<button type="button" class="cbtchip" data-f="todo">未解答</button>'
   +    '<button type="button" class="cbtchip" data-f="ng">間違えた</button>'
   +    '<button type="button" class="cbtchip" data-f="flag">見直し</button>'
   +  '</div>'
   +  '<div class="cbtbody"><div class="cbtgrid" id="cbtGrid"></div></div>'
   +  '<div class="cbtfoot">'
   +    '<div class="cbtlegend">'
   +      '<span><i></i>未解答</span><span><i class="ok"></i>正解</span>'
   +      '<span><i class="ng"></i>不正解</span><span><i class="fl"></i>見直し</span>'
   +    '</div>'
   +    '<button type="button" class="cbtrun" id="cbtRun">この絞り込みだけを順に解く</button>'
   +  '</div>'
   +'</div>';
  document.body.appendChild(scr);

  var grid=document.getElementById('cbtGrid');
  var runBtn=document.getElementById('cbtRun');
  var countEl=document.getElementById('cbtCount');
  var closeBtn=document.getElementById('cbtClose');

  function openScreen(){ scr.hidden=false; paint(); closeBtn.focus(); }
  function closeScreen(){ scr.hidden=true; openBtn.focus(); }
  openBtn.onclick=openScreen;
  closeBtn.onclick=closeScreen;
  scr.addEventListener('click',function(e){ if(e.target===scr) closeScreen(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !scr.hidden) closeScreen(); });

  scr.querySelectorAll('.cbtchip').forEach(function(c){
    c.onclick=function(){
      filter=c.dataset.f;
      scr.querySelectorAll('.cbtchip').forEach(function(x){ x.classList.toggle('on', x===c); });
      paint();
    };
  });

  // 現在の絞り込みに合致する問題インデックス
  function picked(){
    var out=[];
    QUESTIONS.forEach(function(q,i){
      var s=st[q.id]||{};
      if(filter==='todo' && s.r) return;
      if(filter==='ng'   && s.r!=='ng') return;
      if(filter==='flag' && !s.f) return;
      out.push(i);
    });
    return out;
  }

  function paint(){
    if(scr.hidden) return;
    var list=picked();
    var done=QUESTIONS.filter(function(q){ return (st[q.id]||{}).r; }).length;
    countEl.textContent='解答済み '+done+' / '+QUESTIONS.length;
    grid.innerHTML='';
    if(!list.length){
      grid.innerHTML='<div class="cbtempty">該当する問題はありません。</div>';
      runBtn.disabled=true;
      return;
    }
    runBtn.disabled=false;
    list.forEach(function(i){
      var q=QUESTIONS[i], s=st[q.id]||{};
      var b=document.createElement('button');
      b.type='button';
      b.className='cbtq'+(s.r==='ok'?' ok':s.r==='ng'?' ng':'')+(s.f?' fl':'')
                 +(queue[pos]===i?' cur':'');
      b.textContent=String(q.id).replace(/^\D+/,'')||String(i+1);
      b.title=(q.cat||'')+(s.r?(s.r==='ok'?'／前回○':'／前回×'):'');
      b.onclick=function(){ jump(i); };
      grid.appendChild(b);
    });
  }

  // 任意の問題へジャンプ（出題キューに無ければ全問キューに戻してから移動）
  function jump(i){
    var at=queue.indexOf(i);
    if(at<0){ queue=QUESTIONS.map(function(_,k){return k;}); at=i; }
    pos=at;
    closeScreen();
    renderQuestion();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  runBtn.onclick=function(){
    var list=picked();
    if(!list.length) return;
    queue=list; pos=0;
    closeScreen();
    renderQuestion();
    window.scrollTo({top:0,behavior:'smooth'});
  };

  function toggleFlag(){
    var q=QUESTIONS[queue[pos]]; if(!q) return;
    st[q.id]=st[q.id]||{};
    st[q.id].f=!st[q.id].f;
    persist(); decorate(); paint();
  }

  // 問題カードに「後で見直す」ボタンと前回結果を差し込む
  function decorate(){
    var eb=document.querySelector('#stage .eyebrow');
    if(!eb) return;
    var q=QUESTIONS[queue[pos]]; if(!q) return;
    var s=st[q.id]||{};
    var old=eb.querySelector('.cbtflag'); if(old) old.remove();
    var oldp=eb.querySelector('.cbtprev'); if(oldp) oldp.remove();
    if(s.r){
      var p=document.createElement('span');
      p.className='cbtprev';
      p.textContent = s.r==='ok' ? '前回：○正解' : '前回：×不正解';
      eb.appendChild(p);
    }
    var f=document.createElement('button');
    f.type='button';
    f.className='cbtflag'+(s.f?' on':'');
    f.textContent = s.f ? '見直しに登録済み' : '後で見直す';
    f.onclick=toggleFlag;
    eb.appendChild(f);
  }

  // 解答結果を拾って保存する（正解/不正解の判定は既存エンジンの表示を読む）
  function record(){
    var q=QUESTIONS[queue[pos]]; if(!q) return;
    var v=document.querySelector('#after .verdict'); if(!v) return;
    st[q.id]=st[q.id]||{};
    st[q.id].r = v.classList.contains('ok') ? 'ok' : 'ng';
    persist(); paint();
  }

  // --- 既存関数をラップ（中身は書き換えない） ---
  var _render=renderQuestion;
  renderQuestion=function(){ _render.apply(this,arguments); decorate(); paint();
    // ★decorate() が .eyebrow に足すぶん行の高さが変わるので、足し終わってから測り直す
    if(typeof fitLayout==='function') fitLayout(true); };

  if(typeof choose==='function'){
    var _choose=choose;
    choose=function(){ _choose.apply(this,arguments); record(); };
  }
  if(typeof submitMulti==='function'){
    var _submit=submitMulti;
    submitMulti=function(){ _submit.apply(this,arguments); record(); };
  }

  decorate();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',function(){
  navigator.serviceWorker.register('./sw.js').catch(function(){});});}
// Enter で「次の問題 →／結果へ →」を押す。
// 入力欄・IME変換中・ダイアログが開いている時は効かせない
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing||e.shiftKey||e.ctrlKey||e.metaKey||e.altKey) return;
  var t=e.target;
  if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable)) return;
  // ★属性で見ない。role="dialog" は内側の .cbtpanel に付き、hidden は外側の .cbtscreen に付くので
  //   [role="dialog"]:not([hidden]) は常に一致してしまい、Enter が一度も効いていなかった（2026-09-25 実測）
  var dlg=document.querySelector('[role="dialog"]');
  if(dlg && dlg.getClientRects().length) return;   // 実際に表示されている時だけ止める
  var btn=document.querySelector('#after .actions .btn.primary');
  if(!btn||btn.offsetParent===null) return;
  e.preventDefault(); btn.click();
});
</script>
