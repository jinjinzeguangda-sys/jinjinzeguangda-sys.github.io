function questionHtml(){
  var q=V.q,n=q.options.length,cs=correctSet(q),a=V.answered,res=V.res;
  var state=[],cls=[];
  q.options.forEach(function(_,i){
    var inCorrect=cs.indexOf(i)>=0,sel=V.marks[i]===1;
    if(!a){state.push('closed');cls.push((sel?'sel ':'')+(V.marks[i]===2?'dim':''));}
    else if(sel&&inCorrect){state.push('open');cls.push('sel res-ok');}
    else if(sel&&!inCorrect){state.push('mimic');cls.push('sel res-ng');}
    else if(!sel&&inCorrect){state.push('open');cls.push('res-miss');}
    else{state.push('closed');cls.push('dim');}
  });
  // 問題(問題文＋コード)と部屋を #qlay に入れる。縦長のコードは applyLayout が横並び(部屋が左・問題が右)に切り替える
  var h='<div id="qlay"><div class="qcol"><section class="win"><div class="qhead"><b>'+esc(q.src||'')+'</b><span>'+esc(q.cat||'')+'</span>'+(q.multi?'<span class="multi">'+q.answers.length+'つ選ぶ</span>':'')+'</div><div class="prompt">'+esc(q.prompt)+'</div></section>';
  h+=codeHtml(q);
  // 選択肢は宝箱の「真上」の吹き出し（宝箱が喋る）。コードを読んでから選ぶので、既定ではコードの後ろ
  var wide=stackedCols(n);
  h+='</div><div class="rcol"><div class="roomwrap"><div class="room" id="roomEl" style="--cw:'+wide+'" role="group" aria-label="宝箱の選択肢"><canvas id="room" data-flex="1" aria-hidden="true"></canvas><div class="slots">';
  q.options.forEach(function(o,i){
    var inCorrect=cs.indexOf(i)>=0,sel=V.marks[i]===1,rc='';
    if(a){ if(sel&&inCorrect)rc=' r-ok'; else if(sel&&!inCorrect)rc=' r-ng'; else if(!sel&&inCorrect)rc=' r-miss'; }
    var tag=a?(sel&&inCorrect?'<span class="tag" style="color:var(--ok)">アタリ</span>':(sel?'<span class="tag" style="color:var(--ng)">ミミック</span>':(inCorrect?'<span class="tag" style="color:var(--yellow)">取り逃し</span>':''))):'';
    var mk=V.marks[i]===1?'<span class="mk o"></span>':(V.marks[i]===2?'<span class="mk x"></span>':'');
    h+='<div class="slot'+(sel?' sel':'')+(V.marks[i]===2?' xed':'')+(a?' locked':'')+rc+'" data-row="'+i+'">'
      +'<div class="bubble-wrap"><button type="button" class="bubble'+(hasJa(o)?'':' mono')+'" data-pick="'+i+'" aria-pressed="'+(sel?'true':'false')+'">'+esc(o)+(tag?' '+tag:'')+'</button>'
      +'<button type="button" class="xb" data-x="'+i+'" aria-label="'+LET[i]+' をミミックと判断（×印）" title="ミミックだと思う（×）">×</button></div>'
      +'<button type="button" class="chest '+(cls[i]||'')+'" data-chest="'+i+'" aria-label="宝箱 '+LET[i]+'"><canvas width="16" height="16" data-spr="'+state[i]+'"></canvas>'+mk+'<span class="ltr">'+LET[i]+'</span></button></div>';
  });
  h+='</div><span class="hero '+(a?(res.ok?'hop':'sad'):'')+'"><canvas width="16" height="16" data-spr="hero"></canvas></span></div></div></div></div>';
  if(!a){
    var k=selected().length,nd=need(q);
    h+='<div class="actions sticky"><button type="button" class="big primary" id="btnOpen"'+(k===nd?'':' disabled')+'>'+(k===nd?'○を全て開ける':(q.multi?'あと '+(nd-k)+' つ選んでね':'宝箱を選んでね'))+'</button></div>';
    h+='<div class="actions"><span class="hint">宝箱か選択肢をタップで ○ ／ 右の × はミミックだと思うメモ（採点には使いません）／ キー: A〜 で ○・Enter で開ける</span></div>';
  }else{
    var ansTxt=cs.map(function(i){return LET[i]+'．'+q.options[i];}).join('\n');
    var head=res.ok?(q.multi?'全部アタリだった！':'宝箱を開けた！ アタリだ！'):'ガブッ！ ミミックだった！';
    h+='<section class="win msg"><div class="head '+(res.ok?'ok':'ng')+'">'+head+'</div><div class="ans"><b>正解:</b>\n'+esc(ansTxt)+'</div><div class="exp">'+q.exp+'</div><span class="more">▼</span></section>';
    h+='<div class="actions sticky"><button type="button" class="big primary" id="btnNext">'+(V.i+1<V.list.length?'次の部屋へ ▼':'この階をまとめる ▼')+'</button></div>';
  }
  return h;
}

/* ───────── 操作（イベントは main/status に1回だけ付ける） ───────── */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('button,a'):null;if(!t)return;
  var d=t.dataset||{};
  if(d.chest!==undefined){toggleSel(+d.chest);return;}
  if(d.pick!==undefined){toggleSel(+d.pick);return;}
  if(d.x!==undefined){toggleX(+d.x);return;}
  if(d.floor!==undefined){startFloor(+d.floor,true);return;}
  switch(t.id){
    case 'btnOpen':openChests();break;
    case 'btnNext':next();break;
    case 'btnMenu':toTitle();break;
    case 'btnBack':toTitle();break;
    case 'miTitle':toTitle();break;
    case 'miCont':{var u=firstUnanswered();if(u<0)startFloor(0,false);else startFloor(Math.floor(u/PER),true);break;}
    case 'miFloors':V.screen='floors';render();break;
    case 'miReview':case 'miReview2':{var w=wrongIds();if(w.length)startList(w,'review',0,0);break;}
    case 'miNextFloor':startFloor(V.floor+1,true);break;
    case 'miAgain':startFloor(V.floor,false);break;
    case 'miReset':
      if(!V.armReset){V.armReset=true;render(true);setTimeout(function(){if(V.armReset){V.armReset=false;if(V.screen==='title')render(true);}},4000);}

});
