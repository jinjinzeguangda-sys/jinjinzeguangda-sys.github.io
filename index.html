<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0; url=./hub/">
<title>演習アプリ</title>
<!-- ★ここに manifest を置かないこと。scope が "/" になり、配下の37アプリが
     すべてこのアプリの中に入って「単体でインストール」できなくなる（2026-09-24 実測）。
     入口の本体は /hub/ に在る。 -->
<style>html{color-scheme:light dark}body{font:16px/1.7 system-ui;margin:0;
  display:grid;place-items:center;min-height:100vh}a{color:inherit}</style>
</head>
<body>
<p>入口ページへ移動します … <a href="./hub/">開かない場合はこちら</a></p>
<script>
// 旧 scope "/" の Service Worker を後始末する（残すと古い入口が配られ続ける）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(rs){
    rs.forEach(function(r){
      if (new URL(r.scope).pathname === '/') r.unregister();
    });
  }).catch(function(){});
}
if ('caches' in window) {
  caches.keys().then(function(ks){
    ks.filter(function(k){ return k.indexOf('apps-index-') === 0; })
      .forEach(function(k){ caches.delete(k); });
  }).catch(function(){});
}
location.replace('./hub/');
</script>
</body>
</html>
